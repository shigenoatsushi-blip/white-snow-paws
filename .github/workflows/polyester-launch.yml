name: Polyester Webbing 公開

# 予約実行: 2026-09-26 09:00 JST (= 00:00 UTC)
# 手動実行: GitHub の Actions タブ →「Run workflow」（スマホからも可）
on:
  schedule:
    - cron: '0 0 26 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 公開処理を適用
        run: node .github/scripts/publish-polyester.js

      - name: コミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add index.html product-detail.html
            git commit -m "Polyester Webbing（リード/首輪）を一般公開（自動: COMING SOON解除・パスワードゲート削除・カード/関連商品リンク化）"
            git push
            echo "公開処理を実行しました。Netlifyが自動デプロイします。"
          else
            echo "変更なし（既に公開済み）。"
          fi
